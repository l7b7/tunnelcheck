static_resources:
  listeners:
  - name: h1_loopback
    address:
      socket_address: { address: 0.0.0.0, port_value: 8080 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: tunnelcheck_h1
          codec_type: HTTP1
          route_config:
            name: local_h1_routes
            virtual_hosts:
            - name: only_allowed_connect_target
              domains: ["127.0.0.1:8443"]
              routes:
              - match: { connect_matcher: {} }
                route:
                  cluster: lab_target
                  upgrade_configs:
                  - { upgrade_type: CONNECT, connect_config: {} }
            - name: reject_other_connect_targets
              domains: ["*"]
              routes:
              - match: { connect_matcher: {} }
                direct_response: { status: 403, body: { inline_string: "CONNECT authority is outside this lab allowlist" } }
              - match: { prefix: "/" }
                direct_response: { status: 404 }
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  - name: h2_tls_loopback
    address:
      socket_address: { address: 0.0.0.0, port_value: 9443 }
    filter_chains:
    - transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            alpn_protocols: ["h2"]
            tls_certificates:
            - certificate_chain: { filename: /etc/envoy/certs/proxy.crt }
              private_key: { filename: /etc/envoy/certs/proxy.key }
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: tunnelcheck_h2
          codec_type: HTTP2
          http2_protocol_options: { allow_connect: true }
          route_config:
            name: local_h2_routes
            virtual_hosts:
            - name: only_allowed_connect_target
              domains: ["127.0.0.1:8443"]
              routes:
              - match: { connect_matcher: {} }
                route:
                  cluster: lab_target
                  upgrade_configs:
                  - { upgrade_type: CONNECT, connect_config: {} }
            - name: reject_other_connect_targets
              domains: ["*"]
              routes:
              - match: { connect_matcher: {} }
                direct_response: { status: 403, body: { inline_string: "CONNECT authority is outside this lab allowlist" } }
              - match: { prefix: "/" }
                direct_response: { status: 404 }
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: lab_target
    type: STATIC
    connect_timeout: 1s
    load_assignment:
      cluster_name: lab_target
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: target, port_value: 8443 }
