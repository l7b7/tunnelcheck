name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - run: test -z "$(gofmt -l cmd/tunnelcheck)"
      - run: go test ./...
      - run: go vet ./...
      - run: mkdir -p dist && go build -trimpath -o dist/tunnelcheck ./cmd/tunnelcheck

